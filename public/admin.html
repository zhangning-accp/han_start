<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>青禾街 · 试运营后台</title><link rel="stylesheet" href="/admin.css"></head><body>
<header><a href="/">青禾街 <small>HAN START</small></a><span>免费试运营 · 运营后台</span><button id="logout" hidden>退出管理</button></header>
<main><section id="login-panel" class="panel login"><p class="eyebrow">OPERATIONS</p><h1>了解真实使用情况</h1><p>学习者无需注册。此入口仅供维护者查看统计、审核作品和处理反馈。</p><form id="admin-login"><label for="admin-password">管理口令</label><input id="admin-password" type="password" required autocomplete="current-password"><button class="primary">进入后台</button></form><details><summary>首次设置</summary><p>在项目终端运行 <code>npm run admin -- init</code>，妥善保存生成的管理口令。普通访客不能创建管理员。</p></details></section>
<div id="admin-notice" role="status"></div><section id="dashboard" hidden><div class="admin-shell"><nav class="admin-nav" aria-label="后台分类"><p class="eyebrow">运营工作台</p><button data-section="overview">运营总览</button><button data-section="accounts">账号列表</button><button data-section="learning">学习与布置</button><button data-section="moderation">作品审核</button><button data-section="feedback">反馈与访谈</button><button data-section="pricing">付费意向</button><button data-section="settings">设置与指标说明</button><p>先观察行为，再验证需求。</p></nav><div class="admin-content"><div class="page-title"><div><h1 id="section-title" tabindex="-1">运营总览</h1><p id="section-hint">先看有没有人开始，再看是否完成。</p></div><button id="export-csv">导出当前范围 CSV</button></div>
<form id="filters" class="panel filters"><label>开始日期 UTC<input type="date" id="from" required></label><label>结束日期 UTC<input type="date" id="to" required></label><label>国家<select id="country"><option value="">全部国家</option><option value="VN">越南</option><option value="ID">印度尼西亚</option><option value="BR">巴西</option><option value="OTHER">其他</option><option value="UNKNOWN">未知 / 未提供</option></select></label><details class="advanced-filters"><summary>更多筛选：语言、来源、设备与账号</summary><div class="filter-grid"><label>辅助语言<select id="filter-language"><option value="">全部语言</option><option value="vi">越南语</option><option value="id">印尼语</option><option value="pt-BR">巴西葡语</option><option value="en">英语</option><option value="zh">中文</option></select></label><label>帮助模式<select id="filter-mode"><option value="">全部模式</option><option value="starter">零基础</option><option value="guided">句式帮助</option><option value="independent">自由输入</option></select></label><label>设备<select id="filter-device"><option value="">全部设备</option><option value="mobile">手机</option><option value="desktop">电脑</option></select></label><label>来源渠道<input id="filter-source" maxlength="40" placeholder="留空查看全部"></label><label>招募批次<input id="filter-batch" maxlength="40" placeholder="留空查看全部"></label><label>功能区<select id="filter-area"><option value="">全部功能</option><option value="village">新手村</option><option value="market">夜市主线练习</option><option value="practice">独立复测与问路</option><option value="build">建造编辑器</option><option value="board">共建与作品浏览</option><option value="journal">学习手记</option><option value="feedback">访客设置与反馈</option><option value="unattributed">旧记录／未归属功能</option></select></label><label>个人账户编号<input id="filter-visitor" maxlength="80" placeholder="MD5 或旧编号；留空为全部"></label></div></details><button class="primary">应用筛选</button></form>
<div id="report" aria-live="polite"></div><section class="panel" id="settings-panel" hidden><h2>免费试运营设置</h2><p>起始日期留空表示尚未正式开放。到期不会自动收费。</p><form id="trial-settings"><label>开放日期<input type="date" id="trial-start"></label><label>试运营天数<select id="trial-days"><option value="30">30 天</option><option value="60">60 天</option><option value="90">90 天</option></select></label><button>保存试运营设置</button></form></section></div></div></section></main><footer>青禾街 · 先理解使用者，再决定下一步。 <a href="https://db-ip.com" target="_blank" rel="noreferrer">IP Geolocation by DB-IP</a></footer><script type="module" src="/admin.js"></script></body></html>
